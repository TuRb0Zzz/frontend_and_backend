<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - Портфолио</title>
    <meta name="description" content="Наш сайт">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrapicons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <div class="container-fluid p-0">
        <header class="position-relative">
            <!-- <img src="assets/grob.png" class="img-fluid w-100" style="height: 10vh; object-fit: cover;"> Изображение для header -->
            <div class="container-fluid bg-primary" style="height: 20vh;"></div>
            <div class="container-fluid text-center"> 
                <div class="row">
                    <div class="col border border-2 border-end-0 border-dark p-2">
                        Главная
                    </div>
                    <div class="col border border-2 border-end-0 border-dark p-2">
                        Новости
                    </div>
                    <div class="col border border-2 border-end-0 border-dark p-2">
                        Практики
                    </div>
                    <div class="col border border-2 border-end-0 border-dark p-2">
                        Товары
                    </div>
                    <div class="col border border-2 border-dark p-2">
                        Контакты    
                    </div>
                </div>
            </div> 
        </header>

        <main class="container">
            <section class="m-1 border border-2 border-dark rounded p-2 mx-auto" style="max-width: 700px;">
                <div class="row align-items-center">
                    <div class="col mb-3 text-center">
                        <h1 class="h2 mb-1">Информация о авторе</h1>
                    </div>
                </div>
                <div class="row align-items-center">
                    <div class="col text-center">
                        <img src="assets/cat.jpg" alt="Автор" class="img-fluid rounded-circle" style="width: 150px; height: 150px; object-fit: cover;">
                    </div>
                </div>
                <div class="row align-items-center">
                    <div class="col text-center">
                        <h1 class="h3 mb-1">Николаев Евгений Андреевич</h1>
                    </div>
                </div>
                <div class="row align-items-center">
                    <div class="col text-center">
                        <h1 class="h3 mb-1">ЭФБО-06-24</h1>
                    </div>
                </div>
                <div class="row align-items-center">
                    <div class="col text-center">
                        <div class="border border-dark rounded p-2 mx-auto" style="max-width: 600px; min-height: 100px; display: flex;">
                            Обо мне
                        </div>
                    </div>
                </div>
                <div class="row align-items-center w-75 mx-auto">
                    <div class="col text-center border border-1 border-dark p-0 m-3">
                        Навык 1
                    </div>
                    <div class="col text-center border border-1 border-dark p-0 m-3">
                        Навык 2
                    </div>
                    <div class="col text-center border border-1 border-dark p-0 m-3">
                        Навык 3
                    </div>
                    <div class="col text-center border border-1 border-dark p-0 m-3">
                        Навык 4
                    </div>
                </div>
                <div class="row align-items-center">
                    <div class="col-12">
                        <div class="border border-dark rounded p-2 mb-3 mx-auto" style="max-width: 600px; min-height: 100px; display: flex; flex-direction: column;">
                            Мой опыт:
                            <div class="border border-dark rounded p-2 mt-3 mx-auto" style="max-width: 500px; width: 90%; min-height: 100px; display: flex; align-items: left; justify-content: left;">
                                Опыт 1
                            </div>
                            <div class="border border-dark rounded p-2 mt-3 mx-auto" style="max-width: 500px; width: 90%; min-height: 100px; display: flex; align-items: left; justify-content: left;">
                                Опыт 2
                            </div>
                            <div class="border border-dark rounded p-2 mt-3  mb-3 mx-auto" style="max-width: 500px; width: 90%; min-height: 100px; display: flex; align-items: left; justify-content: left;">
                                Опыт 3
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <!-- <img src="assets/grob.png" class="img-fluid w-100" style="height: 10vh; object-fit: cover;"> Изображение для footer -->
             <div class="container-fluid bg-primary" style="height: 20vh;"></div>
        </footer>
    </div>

</html>
